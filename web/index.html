<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Observatory</title>
  <meta name="description" content="Indian equities, derivatives and flows: descriptive analysis and the Nifty200 Momentum 30 replication. No signals or forecasts.">
  <meta name="theme-color" content="#0e0e0d">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">Market Observatory</h1>
      <div class="caption" id="subtitle">Loading…</div>
    </header>
    <div class="controls">
      <div><div class="ctl-label">View</div><div class="seg" id="nav"></div></div>
      <div id="winbox"><div class="ctl-label">Window</div><div class="seg" id="win"></div></div>
    </div>
    <main id="view"><div class="loading">Loading data…</div></main>
    <div class="foot" id="foot"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
