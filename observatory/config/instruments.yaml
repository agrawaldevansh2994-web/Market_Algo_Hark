# --------------------------------------------------- Commodities (INR) — see §4.2
# SYNTHETIC: usd_price x USDINR. Legitimate for C1 (currency-vs-metal
# decomposition). MUST NOT be used for C5 (basis) — its basis is zero by
# construction. Real MCX prices are open item 4.
gold_inr_synth:
  name: Gold, synthetic INR
  klass: commodity
  source: derived
  ticker: null
  currency: INR
  session: us_session
  role: subject
  status: ok
  answers: [C1]
  derived_from: [gold_usd, usdinr]

silver_inr_synth:
  name: Silver, synthetic INR
  klass: commodity
  source: derived
  ticker: null
  currency: INR
  session: us_session
  role: subject
  status: ok
  answers: [C1]
  derived_from: [silver_usd, usdinr]

brent_inr_synth:
