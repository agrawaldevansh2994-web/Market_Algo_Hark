# Instrument registry — the single source of truth for what the observatory tracks.
# Scope and rationale: research/02-observatory-scope.md
#
# Fields:
#   name       human-readable
#   klass      equity_index | volatility | rates | flows | commodity | fx
#   source     yfinance | nse | derived | unresolved
#   ticker     source-specific symbol (null where source unresolved)
#   currency   quote currency
#   session    trading session — drives the timezone-contamination policy (scope §4.1)
#              ist_close  = settles 15:30 IST, aligns cleanly with Indian equities
#              us_session = settles after Indian close; same-day joins are contaminated
#              global_24h = near-continuous
#   role       subject = studied in its own right
#              context = present only to make a question answerable
#   status     ok | verify | unresolved
#   answers    question IDs from scope §3 this instrument is required for

# ---------------------------------------------------------------- Indian equity
nifty50:
  name: NIFTY 50
  klass: equity_index
  source: yfinance
  ticker: "^NSEI"
  currency: INR
  session: ist_close
  role: subject
  status: verify
  answers: [A1, A3, B1, C2, C3, D1, D2, D3, E1, E2, F1, F2, G1]

niftybank:
  name: NIFTY Bank
  klass: equity_index
  source: yfinance
  ticker: "^NSEBANK"
  currency: INR
  session: ist_close
  role: subject
  status: verify
  answers: [A1, A4, D3, G1]

niftyit:
  name: NIFTY IT
  klass: equity_index
  source: yfinance
  ticker: "^CNXIT"
  currency: INR
  session: ist_close
  role: subject
  status: verify
  answers: [A2, D3, G1]
  notes: Dollar-earner. Expected inverse exposure to USDINR — the point of A2.

niftymidcap:
  name: NIFTY Midcap
  klass: equity_index
  source: yfinance
  ticker: "^NSEMDCP50"
  currency: INR
  session: ist_close
  role: subject
  status: verify
  answers: [A3, D3, G1]
  notes: >
    Open item 1. Midcap 150 preferred over Midcap 50 for breadth; ticker
    availability on the free source is unconfirmed. Verify before relying on A3.

# ------------------------------------------------------------ Volatility, rates
indiavix:
  name: India VIX
  klass: volatility
  source: yfinance
  ticker: "^INDIAVIX"
  currency: index
  session: ist_close
  role: subject
  status: verify
  answers: [D1, D2, D3]
  notes: The regime variable. Most conditional statements key off this.

india10y:
  name: India 10Y G-Sec yield
  klass: rates
  source: unresolved
  ticker: null
  currency: percent
  session: ist_close
  role: subject
  status: unresolved
  answers: [A4]
  notes: Open item 2. Candidates — NSE, CCIL, FRED (monthly only, too coarse).

# ---------------------------------------------------------------------- Flows
fii_net_cash:
  name: FII/FPI net cash flow (NSE provisional)
  klass: flows
  source: nse
  ticker: null
  currency: INR_crore
  session: ist_close
  role: subject
  status: ok
  answers: [E1, E2]
  notes: >
    NSE fiidiiTradeReact, trade-date T. Latest day only — captured nightly by
    capture.py, history accumulates from 2026-09-25. For FPI history use
    fpi_equity_nsdl.

dii_net_cash:
  name: DII net cash flow (NSE provisional)
  klass: flows
  source: nse
  ticker: null
  currency: INR_crore
  session: ist_close
  role: subject
  status: ok
  answers: [E1, E2]
  notes: >
    Same endpoint as fii_net_cash. No free historical source found, so a
    missed nightly capture is a permanent gap.

fpi_equity_nsdl:
  name: FPI net equity investment, all routes (NSDL)
  klass: flows
  source: nsdl
  ticker: null
  currency: INR_crore
  session: ist_close
  role: subject
  status: ok
  answers: [E1, E2]
  notes: >
    Custodian-confirmed, daily since 1999-01. Dated by REPORTING date, which
    covers trades up to the previous trading day — roughly T+1 against NSE.
    Includes primary-market investment (IPOs, placements).

fpi_equity_exch_nsdl:
  name: FPI net equity investment, stock-exchange route (NSDL)
  klass: flows
  source: nsdl
  ticker: null
  currency: INR_crore
  session: ist_close
  role: subject
  status: ok
  answers: [E1, E2]
  notes: >
    Secondary-market only — the NSDL series comparable to NSE provisional
    FII net. Reporting-date convention as fpi_equity_nsdl. Exists only once
    NSDL began splitting by investment route.

