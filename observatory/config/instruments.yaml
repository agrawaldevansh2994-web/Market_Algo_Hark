# -------------------------------------------------------------------------- FX
# PRIMARY = FRED H.10. The yfinance `=X` spot quotes were measured and rejected
# for daily use — see scope §4.5. H.10 rates are all snapped at noon ET, so
# cross-FX relationships are internally consistent. Cost: a few days' lag.
usdinr:
  name: USD/INR (H.10)
  klass: fx
  source: fred
  ticker: "DEXINUS"
  currency: INR
  session: noon_et
  role: subject
  status: ok
  answers: [A2, B1, B2, C1, D3, G1]
  notes: INR per USD. The core India variable — B1 is the headline question.

eurusd:
  name: EUR/USD (H.10)
  klass: fx
  source: fred
  ticker: "DEXUSEU"
  currency: USD
  session: noon_et
  role: context
  status: ok
  answers: [B2]
  notes: USD per EUR. Largest DXY component.

usdjpy:
  name: USD/JPY (H.10)
  klass: fx
  source: fred
  ticker: "DEXJPUS"
  currency: JPY
  session: noon_et
  role: subject
  status: ok
  answers: [B3, D3, G1]
  notes: Carry / global risk barometer. Yen-carry unwinds hit EM disproportionately.

usdcny:
  name: USD/CNY (H.10)
  klass: fx
  source: fred
  ticker: "DEXCHUS"
  currency: CNY
  session: noon_et
  role: subject
  status: ok
  answers: [B2, C2, G1]
  notes: >
    Onshore CNY, not offshore CNH. China proxy — drives copper and the
    EM-Asia currency bloc.

dxy:
  name: US Dollar Index (ICE)
  klass: fx
  source: yfinance
  ticker: "DX-Y.NYB"
  currency: index
  session: us_session
  role: subject
  status: ok
  answers: [B2, C2, D3, G1]
  notes: >
    The market-standard DXY — six currencies, euro-heavy. Verified healthy
    (r=-0.84 vs H.10 EUR/USD daily); the =X defect does not affect it.

dxy_broad:
  name: Fed Broad Dollar Index
  klass: fx
  source: fred
  ticker: "DTWEXBGS"
  currency: index
  session: noon_et
  role: subject
  status: ok
  answers: [B2, G1]
  notes: >
    Trade-weighted across 26 currencies including INR and CNY, so it is the
    more India-relevant dollar measure. Kept alongside ICE DXY because the
    two answer different questions. Starts 2006.

# Rejected for daily use, retained as context only — scope §4.5.
# Weekly-resampled they are fine (r=-0.82 vs DXY, matching FRED), so they are
# the fallback if H.10's publication lag ever becomes a problem.
usdinr_yf:
  name: USD/INR (Yahoo spot)
  klass: fx
  source: yfinance
  ticker: "USDINR=X"
  currency: INR
  session: global_24h
  role: context
  status: verify
  answers: []
  notes: >
    DEFECTIVE DAILY. Close==Open on 40% of days; correlation with DXY splits
    across two days. Do not use for daily analysis. Weekly is usable.

eurusd_yf:
  name: EUR/USD (Yahoo spot)
  klass: fx
  source: yfinance
  ticker: "EURUSD=X"
  currency: USD
  session: global_24h
  role: context
  status: verify
  answers: []
  notes: >
    DEFECTIVE DAILY. r=-0.34 vs DXY where H.10 gives -0.84. Retained purely
    as the evidence exhibit for scope §4.5 and as a weekly fallback.

