[server]
headless = true
address = "127.0.0.1"

[browser]
gatherUsageStats = false

# Surfaces are the ones the chart palette was validated against
# (dataviz skill: light #fcfcfb, dark #1a1a19). Primary = categorical slot 1.
[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ed"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#ffffff"
